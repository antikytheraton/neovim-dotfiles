set-environment -g PATH "/opt/homebrew/bin:/usr/local/bin:/bin:/usr/bin"
unbind %
bind | split-window -h
bind - split-window -v

bind 1 switchc -t 'Work Session' # prefix + 1 switches to a named session
bind 2 switchc -t 'Hack Session' # prefix + 2 switches to a named session
bind a switch-client -l

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Improve colors
# set-option -sa terminal-overrides ",screen-256color:RGB"
# set-option -ga terminal-overrides ",xterm-256color:Tc" --
# set-option -ga terminal-overrides ",screen-256color:Tc"
set-option -ga terminal-overrides ",tmux-256color:Tc"
# set -g default-terminal "screen-256color"
# set -g default-terminal "xterm-256color"
set -g default-terminal "tmux-256color"

# IMGCAT
set-option -g allow-passthrough on

# start tmux when computer starts
# set -g @continuum-boot 'on'

# Set scrollback buffer to 10000
set -g history-limit 10000

# set base index of session and window to 1
set -g base-index 1
setw -g pane-base-index 1

# Automatically set window title
set-window-option -g automatic-rename on
set-option -g set-titles on

# Customize the status line
set -g status-fg  green
# set -g status-bg  black

# vim copy mode for <C-a> and status key
setw -g mode-keys vi
set -g status-keys vi

# enable mouse movements capture
set -g mouse on

# enable clipboard integration
set-option -g set-clipboard on

# window splits
bind-key v split-window -h
bind-key s split-window -v

# swap-window
# bind-key -n C-S-Left swap-window -t -1
# bind-key -n C-S-Right swap-window -t +1
bind-key -n M-S-Left swap-window -t -1\; select-window -t -1
bind-key -n M-S-Right swap-window -t +1\; select-window -t +1

# resizing panes
bind-key -r j resize-pane -D 5
bind-key -r k resize-pane -U 5
bind-key -r h resize-pane -L 5
bind-key -r l resize-pane -R 5
bind-key -r m resize-pane -Z # maximize/unmaximize pane

# bind-key M-j resize-pane -D
# bind-key M-k resize-pane -U
# bind-key M-h resize-pane -L
# bind-key M-l resize-pane -R

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Use Alt-vim keys without prefix key to switch panes
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# No delay for escape key press
set -sg escape-time 0

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-s' select-pane -l

# Reload tmux config
bind r source-file ~/.config/tmux/tmux.conf

# tmux-continuum
# set -g @continuum-boot 'on'
# set -g @continuum-boot-options 'ghostty'

set -g @plugin 'tmux-plugins/tpm' # plugin manager
set -g @plugin 'tmux-plugins/tmux-sensible' # nice set of standard options
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmussessions after reboot
set -g @resurrect-capture-pane-contents 'on' # capture pane contents when saving sessions
set -g @resurrect-strategy-vim 'session' # resurrect nvim session as well as tmux
set -g @resurrect-strategy-nvim 'session' # resurrect nvim session as well as tmux
# set -g @plugin 'tmux-plugins/tmux-continuum' # auto save sessions every 15 min
set -g @plugin 'phedre/tmux-continuum-ghostty/' # continuum for ghostty
set -g @plugin 'tmux-plugins/tmux-yank' # yank support
set -g @plugin 'christoomey/vim-tmux-navigator' # navigate tmux and vim in the same way
set -g @plugin 'sainnhe/tmux-fzf' # fzf plugin panel
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name' # add nerdfont iconson panel name
set -g @plugin 'o0th/tmux-nova' # custom nova theme
set -g @plugin 'tmux-plugins/tmux-copycat' # tmux search
set -g @plugin 'tmux-plugins/tmux-open' # open files and url
set -g @plugin 'tmux-plugins/tmux-logging' # tmux pane logs capture

# Set shell to zsh
set -g default-command "$SHELL"

# focus events
set -g focus-events on

### NOVA Theme configuration ###
set -g @nova-nerdfonts true
set -g @nova-nerdfonts-left 
set -g @nova-nerdfonts-right 

### COLORS ###
b_bg="#44475a"

seg_a="#e24f31 #2e3440"
seg_b="#66def9 #06101e"

inactive_bg="#06101e"
inactive_fg="#35b5ff"
active_bg="#e24f31"
active_fg="#2e3540"

set -g @nova-pane-active-border-style "$b_bg"
set -g @nova-pane-border-style "$b_bg"
set -g @nova-status-style-bg "$inactive_bg"
set -g @nova-status-style-fg "$inactive_fg"
set -g @nova-status-style-active-bg "$active_bg"
set -g @nova-status-style-active-fg "$active_fg"
set -g @nova-status-style-double-bg "$b_bg"

### STATUS BAR ###
set -g @nova-pane "#I#{?pane_in_mode, / #{pane_mode},}  #W"

set -g @nova-segment-mode "#{?client_prefix,󰀘 ,}"
set -g @nova-segment-mode-colors "$seg_a"

set -g @nova-segment-whoami "#(whoami)@#h "
set -g @nova-segment-whoami-colors "$seg_b"

# set -g @nova-segment-cpu "/"
# set -g @nova-segment-cpu-colors "$inactive_bg $inactive_bg"

set -g @nova-segment-date '%Y-%m-%d'
set -g @nova-segment-date-colors "$seg_a"
set -g @nova-segment-time '%H:%M '
set -g @nova-segment-time-colors "$seg_a"

set -g @nova-rows 0
set -g @nova-segments-0-left "mode"
set -g @nova-segments-0-right "whoami time"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
